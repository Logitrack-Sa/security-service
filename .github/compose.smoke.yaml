# Únicamente CI: claves y credenciales descartables, Config simulado.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: security_ci
      MYSQL_USER: security_ci
      MYSQL_PASSWORD: only-ci-database-password
      MYSQL_ROOT_PASSWORD: only-ci-root-password
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u$$MYSQL_USER --silent']
      interval: 3s
      timeout: 3s
      retries: 30
  config:
    image: python:3.13-slim@sha256:57b29a7c050c4e679e4bea572e14b3965cf4b5839de2da49d55e49ffc4024f39
    command: [python, /fixture/server.py]
    volumes:
      - ./scripts/config_fixture.py:/fixture/server.py:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8765/security-service/prod')"]
      interval: 2s
      timeout: 2s
      retries: 20
  security-service:
    image: local/security-service:ci
    ports: ["127.0.0.1:8083:8083"]
    environment:
      CONFIG_SERVER_URL: http://config:8765
      DB_URL: jdbc:mysql://mysql:3306/security_ci?allowPublicKeyRetrieval=true&sslMode=REQUIRED
      DB_USERNAME: security_ci
      DB_PASSWORD: only-ci-database-password
      SECURITY_ADMIN_ENABLED: 'true'
      SECURITY_ADMIN_USERNAME: fixture-admin
      SECURITY_ADMIN_EMAIL: fixture-admin@example.test
      SECURITY_ADMIN_PASSWORD: only-ci-admin-password
      JWT_PRIVATE_KEY_LOCATION: file:/secrets/private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/secrets/public.pem
      JWT_KEY_ID: ci-ephemeral
    volumes:
      - ${SMOKE_FIXTURE_DIR:?}/private.pem:/secrets/private.pem:ro
      - ${SMOKE_FIXTURE_DIR:?}/public.pem:/secrets/public.pem:ro
    depends_on:
      mysql: { condition: service_healthy }
      config: { condition: service_healthy }
