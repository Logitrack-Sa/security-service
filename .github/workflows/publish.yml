name: Publicar imagen versionada en Docker Hub
on:
  push:
    tags: ['sprint2-*']
  workflow_dispatch:
    inputs:
      version:
        description: Versión sprint2-AAAAMMDD.N
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'push' || github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar versión, destino y revisión integrada
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^sprint2-[0-9]{8}\.[0-9]+$ ]]
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]{2,}$ ]]
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN" || { echo 'Configurar el secreto limitado DOCKERHUB_TOKEN'; exit 1; }
          git merge-base --is-ancestor HEAD origin/develop || git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verificar antes de publicar
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Construir, publicar y registrar digest
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="$DOCKERHUB_NAMESPACE/logitrack-security-service:$VERSION"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker build --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" --label org.opencontainers.image.revision="${{ github.sha }}" --label org.opencontainers.image.version="$VERSION" -t "$image" .
          docker push "$image"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > image-digests.json
          printf 'Imagen publicada: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          cat image-digests.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-security-service
          path: image-digests.json
