name: Revisión IA y estados Sprint 2
on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
    inputs:
      number:
        description: Número de PR a revisar
        type: string
        required: true
permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write
  statuses: write
  copilot-requests: write
jobs:
  review:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/review'))
    concurrency:
      group: review-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      # Siempre main del repositorio base. Nunca ejecutar checkout del head del PR con estos permisos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Instalar motor de revisión fijado
        run: npm install --global @github/copilot@1.0.103 --no-audit --no-fund
      - name: Revisar evento y sincronizar estados
        run: node automation/bot.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: '2'
