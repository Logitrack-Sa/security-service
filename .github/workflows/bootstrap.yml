name: Verificar base Spring Boot
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: foundation_test
          MYSQL_USER: foundation_test
          MYSQL_PASSWORD: test-only
          MYSQL_ROOT_PASSWORD: test-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Suite aislada con H2
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Esquema Flyway, persistencia y API con MySQL
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/foundation_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          TEST_DB_USERNAME: foundation_test
          TEST_DB_PASSWORD: test-only
        run: ./mvnw --batch-mode --no-transfer-progress verify
