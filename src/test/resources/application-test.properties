spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:security_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
security.admin.enabled=${TEST_SECURITY_ADMIN_ENABLED:false}
spring.cloud.config.enabled=false

eureka.client.enabled=false
management.health.mail.enabled=false

# Credenciales SMTP simuladas exclusivamente para pruebas
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test-sender@logitrack.com
spring.mail.password=test-smtp-password

# Las suites generales no dependen de infraestructura Redis externa.
spring.cache.type=none
management.health.redis.enabled=false
