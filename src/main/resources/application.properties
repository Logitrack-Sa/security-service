spring.application.name=security-service
server.port=${SERVER_PORT:8083}

# Compatibilidad de Spring Cloud con Spring Boot 3.5.x
spring.profiles.default=dev

# Importación de configuración externa centralizada desde Spring Cloud Config Server
# La importación obligatoria se declara en application-dev/prod.properties.

# Configuración de base de datos MySQL (centralizada, sin secretos en repositorio)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:security_db}?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:security_user}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# Actuator y observabilidad
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

# Provisión de ADMIN inicial desde entorno seguro
security.admin.enabled=${SECURITY_ADMIN_ENABLED:false}
security.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.admin.email=${SECURITY_ADMIN_EMAIL:admin@logitrack.com}
security.admin.password=${SECURITY_ADMIN_PASSWORD:}

# Propiedades JWT y criptografía
logitrack.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:${logitrack.security.private-key-location:}}
logitrack.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:${logitrack.security.public-key-location:}}
logitrack.security.jwt.key-id=${JWT_KEY_ID:${logitrack.security.key-id:logitrack-main}}
logitrack.security.jwt.issuer=${JWT_ISSUER:${logitrack.security.issuer:https://security-service}}
logitrack.security.jwt.audiences=${JWT_AUDIENCES:security-service,courier-service,shipment-service}
logitrack.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
logitrack.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:0}
logitrack.security.jwt.token-ttl=${JWT_TTL:${logitrack.security.token-ttl:}}

# El perfil central sprint3 activa el registro; Sprint 2 conserva su arranque.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}

# Configuración de Envío de Correo (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logitrack.frontend.verification-url=${FRONTEND_URL:http://localhost:3000}/verify-email

# Perfiles Cache-Aside (15 minutos), sin contraseñas ni entidades JPA
spring.cache.type=redis
spring.cache.cache-names=user_profiles
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
