spring.application.name=security-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-stacktrace=never

security.admin.enabled=${SECURITY_ADMIN_ENABLED:true}
security.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.admin.email=${SECURITY_ADMIN_EMAIL:admin@logitrack.com}
security.admin.password=${SECURITY_ADMIN_PASSWORD:admin123}

logitrack.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
logitrack.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
logitrack.security.jwt.key-id=${JWT_KEY_ID:logitrack-main}
logitrack.security.jwt.issuer=${JWT_ISSUER:https://security-service}
logitrack.security.jwt.audiences=${JWT_AUDIENCES:courier-service,shipment-service}
logitrack.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
